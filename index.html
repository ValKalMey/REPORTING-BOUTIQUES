/* ===== Galler · Reporting boutiques ===== */
:root{
  color-scheme:light;
  --g-orange:#D35E13; --g-noir:#000; --g-blanc:#fff;
  --ink:#000; --ink-2:#2b2b2b; --muted:#595959; --faint:#8c8c8c;
  --line:#e6e3df; --line-2:#f1eeea; --surface:#fff; --bg:#f7f5f2; --tint:#fbf1ea;
  --n1:#595959; --n2:#b3b3b3; --bud:#000;
  --pos:#00A266; --neg:#D35E13;
  --font:"Brown LL",Arial,system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --font-d:"Manier","Brown LL",Arial,sans-serif;
  --r-sm:4px; --r-md:8px; --r-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
.num,td.n,.gr-tile-v{font-variant-numeric:tabular-nums}

/* ---------- Barre du haut ---------- */
.gr-top{background:var(--g-orange);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.gr-top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 24px}
.gr-logo{height:52px;width:auto;display:block}
.gr-title{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.gr-title b{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:.01em}
.gr-title span{font-size:12px;opacity:.92;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.gr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gr-btn{appearance:none;border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:var(--r-md);padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.gr-btn:hover{background:rgba(255,255,255,.14)}
.gr-btn.solid{background:#fff;color:var(--g-noir);border-color:#fff}
.gr-btn.solid:hover{background:#f6e6dc}
.gr-btn svg{width:16px;height:16px}
.gr-btn[disabled]{opacity:.45;cursor:default}
.gr-lang{display:inline-flex;border:1px solid rgba(255,255,255,.7);border-radius:var(--r-md);overflow:hidden}
.gr-lang button{border:0;background:transparent;color:#fff;padding:7px 10px;cursor:pointer;font-weight:500}
.gr-lang button.on{background:#fff;color:#000}
.gr-tabs{background:#F2B48A}
.gr-tabs-in{max-width:1440px;margin:0 auto;display:flex;gap:2px;padding:0 24px;overflow-x:auto}
.gr-tab{appearance:none;border:0;background:transparent;color:#4a2610;padding:12px 16px;cursor:pointer;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.gr-tab:hover{color:#000}
.gr-tab.on{color:#000;font-weight:700;border-bottom-color:#000}

/* ---------- Contenu ---------- */
.gr-main{max-width:1440px;margin:0 auto;padding:20px 24px 60px}
.gr-status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.gr-status .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.gr-status .warn{color:#8a3a06;background:var(--tint);border-color:#f0d3bf}
.gr-hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin:4px 0 18px}
.gr-hero h1{font-family:var(--font-d);font-size:30px;line-height:1.1;margin:0;font-weight:700}
.gr-hero .sub{color:var(--muted);font-size:14px;margin-top:4px}
.gr-hero .ctl{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gr-sel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.gr-sel select{border:1px solid var(--line);background:#fff;border-radius:var(--r-md);padding:7px 10px;color:#000;font-weight:500}
.gr-chips{display:flex;gap:6px;flex-wrap:wrap}
.gr-chip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.gr-chip:hover{border-color:#000}
.gr-chip.on{background:#000;color:#fff;border-color:#000}
.blk h2{display:flex;align-items:center;gap:8px}
.blk h2::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--g-orange)}
.blk h2::before{background:#DD7A3E}.blk[data-id=years] h2::before{background:#2FA391}.blk[data-id=decomp] h2::before{background:#9B7BC8}.blk[data-id=table] h2::before{background:#5A97D1}.blk[data-id=facts] h2::before{background:#EC9A3A}
.gr-chip .dot{width:9px;height:9px;border-radius:50%}

.gr-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.blk{grid-column:span 12;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px 16px;min-width:0;position:relative}
.blk.bare{background:transparent;border:0;padding:0}
.blk h2{font-family:var(--font-d);font-weight:700;font-size:18px;line-height:1.25;margin:0 0 2px}
.blk .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.blk .chart{width:100%;min-height:40px;position:relative}
.blk .foot{color:var(--faint);font-size:11.5px;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

    S.files.forEach(function (f) {
      (f.warnings || []).forEach(function (w) {
        if (w.k === 'ytdStart') { if (f === sn && !ytdW && S.tab === 'ytd') { ytdW = true; h += '<span class="chip warn">' + t('warnYtd', { d: dfmt(w.from) }) + '</span>'; } }
        else if (w.k === 'sumMismatch' || w.k === 'gtMismatch') h += '<span class="chip warn">' + t('warnSum', { f: esc(f.file), v: w.view, a: eur(w.sum), b: eur(w.tot) }) + '</span>';
      });
    });
    return h;
  }
  function render() {
    tip.classList.remove('on');
    document.documentElement.lang = S.lang;
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    document.querySelectorAll('.gr-lang button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === S.lang); });
    var has = !!(S.M && S.M.years.length);
    document.querySelectorAll('[data-act="pdf"]').forEach(function (b) { b.hidden = !OFFLINE; b.disabled = !has; });
    ['layout'].forEach(function (k) { var b = document.querySelector('[data-act="' + k + '"]'); if (b) b.disabled = !has; });
    document.getElementById('gr-tabs').style.display = has ? '' : 'none';
    if (ro) ro.disconnect();
    document.querySelectorAll('[data-act="import"]').forEach(function (b) { b.hidden = !CAN_EDIT; var sp = b.querySelector('span'); if (sp) sp.textContent = t(LIVE ? 'import' : 'importOff'); });
    if (!has) { app.querySelector('.gr-main').innerHTML = msgsHtml() + dropHtml(); S.editing = false; document.body.classList.remove('editing'); return; }
    document.querySelectorAll('.gr-tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === S.tab); });
    var main = app.querySelector('.gr-main'), Y = Yr(), sn = snap();
    if (!S.shop) S.shop = 'ALL';
    if (!sn.views[S.hz]) S.hz = 'week';
    if (S.shop !== 'ALL' && !Y.entities.some(function (e) { return e.id === S.shop; })) S.shop = 'ALL';
    var hz = HZ[S.tab] ? horizons(sn).filter(function (x) { return x.k === hzKey(S.tab); })[0] : null;
    var hero = '<div class="gr-hero"><div><h1>' + esc(t('weekN', { w: sn.week })) + ' · ' + Y.year + (hz && S.tab !== 'week' ? ' — ' + esc(t('tab_' + S.tab)) : S.tab === 'recap' ? ' — ' + esc(t('tab_recap')) : '') + (isShop() && (HZ[S.tab] || S.tab === 'recap') ? ' · ' + esc(shopName(S.shop)) : '') + '</h1><div class="sub">' + esc(hz ? hz.sub : weekRange(Y, sn.week)) + '</div></div><div class="ctl">';
    if (HZ[S.tab] || S.tab === 'recap') hero += '<div class="gr-chips" role="group" aria-label="' + esc(t('s_choose')) + '"><button class="gr-chip' + (S.shop === 'ALL' ? ' on' : '') + '" data-shop="ALL">' + t('all') + '</button>' + Y.entities.map(function (e, i) { return '<button class="gr-chip' + (e.id === S.shop ? ' on' : '') + '" data-shop="' + e.id + '"><span class="dot" style="background:' + colorOf(e.id, i) + '"></span>' + esc(e.name) + '</button>'; }).join('') + '</div>';
    hero += weekSelect() + '</div></div>';
    var st = statusHtml();
    main.innerHTML = msgsHtml() + (st ? '<div class="gr-status">' + st + '</div>' : '') + hero + '<div class="gr-grid" id="gr-grid"></div>';
    renderBlocks(main.querySelector('#gr-grid'), S.tab, getLayout(S.tab), true);
    if (S.editing) layoutPanel();
  }
  function msgsHtml() {
    if (!S.msgs.length) return '';
    return '<div class="gr-msg' + (S.msgs.some(function (m) { return m.warn; }) ? ' warn' : '') + '" role="status"><div>' + S.msgs.map(function (m) { return '<div>' + esc(m.text) + '</div>'; }).join('') + '</div><button class="lnk" data-act="msgclose">' + t('close') + '</button></div>';
  }
  function dropHtml() {
    var body;
    if (S.loading) body = '<p>' + t('loadingStore') + '</p>';
    else if (!CAN_EDIT) body = '<p>' + t('emptyViewer') + '</p>';
    else body = '<p>' + t(OFFLINE ? 'dropLeadOff' : 'dropLead') + '</p><div class="gr-zone" data-act="pick" role="button" tabindex="0"><b>' + t('dropZone') + '</b><span>' + t('dropZone2') + '</span></div>' +
      '<div class="gr-priv">' + t(LIVE ? 'privacy' : OFFLINE ? 'privacyOff' : 'noStore') + '</div>';
    return '<div class="gr-drop reveal"><div class="gr-drop-art">' + tabletArt() + '</div><div class="gr-drop-in"><h1>' + t('dropTitle') + '</h1>' + body + '</div></div>';
  }
  // Motif « tablette » : carrés découpés dans l'aplat orange
  function tabletArt() {
    var s = '<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="400" fill="#D35E13"/>';
    for (var r = 0; r < 6; r++) for (var c = 0; c < 3; c++) s += '<rect x="' + (26 + c * 88) + '" y="' + (22 + r * 64) + '" width="72" height="48" rx="8" fill="#fff" opacity="' + ((r + c) % 4 === 0 ? 1 : 0.16) + '"/>';
    return s + '<rect x="0" y="330" width="300" height="70" fill="#000"/><rect x="0" y="330" width="120" height="70" fill="#AF451C"/></svg>';
  }

  /* ---------- Panneau de mise en page ---------- */
  var panel = document.getElementById('gr-layout');
  function layoutPanel() {
    var L = getLayout(S.tab);
    panel.querySelector('header b').textContent = t('lay_title') + ' · ' + t('tab_' + S.tab);
    panel.querySelector('p').textContent = t('lay_help');
    panel.querySelector('.lst').innerHTML = L.map(function (x, i) {
      var opts = [3, 4, 5, 6, 7, 8, 12].map(function (n) { return '<option value="' + n + '"' + (n === x.span ? ' selected' : '') + '>' + n + '/12</option>'; }).join('');
      return '<div class="row' + (x.hidden ? ' off' : '') + '" data-id="' + x.id + '"><span>' + esc(blockTitle(S.tab, x.id)) + '</span><button data-ed="up" title="' + t('lay_up') + '">↑</button><button data-ed="down" title="' + t('lay_down') + '">↓</button><select data-ed="span">' + opts + '</select><button data-ed="hide" title="' + t('lay_hide') + '">◐</button></div>';
    }).join('');
    panel.querySelector('[data-ed="reset"]').textContent = t('lay_reset');
    panel.querySelector('footer [data-ed="done"]').textContent = t('lay_done');
  }
  function editOp(id, op, val) {
    var L = getLayout(S.tab).map(function (x) { return Object.assign({}, x); }), i = L.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    if (op === 'up' && i > 0) L.splice(i - 1, 0, L.splice(i, 1)[0]);
    if (op === 'down' && i < L.length - 1) L.splice(i + 1, 0, L.splice(i, 1)[0]);
    var steps = [3, 4, 5, 6, 7, 8, 12], si = steps.indexOf(L[i] && L[i].span);
    if (op === 'wider') L[i].span = steps[Math.min(steps.length - 1, (si < 0 ? 3 : si) + 1)];
    if (op === 'narrow') L[i].span = steps[Math.max(0, (si < 0 ? 3 : si) - 1)];
    if (op === 'span') L[i].span = +val;
    if (op === 'hide') L[i].hidden = !L[i].hidden;
    if (op === 'move') { var j = L.findIndex(function (x) { return x.id === val; }); var it = L.splice(i, 1)[0]; L.splice(j < 0 ? L.length : j, 0, it); }
    setLayout(S.tab, L); render();
  }

  /* ---------- Import ---------- */
  var input = document.getElementById('gr-file');
  function readFiles(list) {
    list = Array.prototype.slice.call(list || []).filter(function (f) { return /\.xls[xmb]?$/i.test(f.name); });
    if (!list.length) return;
    var main = app.querySelector('.gr-main');
    main.insertAdjacentHTML('afterbegin', '<div class="gr-status"><span class="chip">' + t('loading') + '</span></div>');
    Promise.all(list.map(function (f) {
      return f.arrayBuffer().then(function (buf) {
        try {
          var wb = XLSX.read(buf, { type: 'array', cellDates: true });
          var p = GP.parseWorkbook(wb, f.name); p.mtime = f.lastModified; return p;
        } catch (e) { console.error(e); return { file: f.name, ok: false, error: 'read' }; }
      });
    })).then(function (res) {
      if (LIVE) return saveReports(res);
      // mode sans base (aperçu local) : en mémoire seulement
      res.forEach(function (p) { S.files = S.files.filter(function (x) { return x.file !== p.file || x.week !== p.week; }); S.files.push(p); });
      remerge(true); render();
    });
  }
  function remerge(jump) {
    S.M = GP.merge(S.files);
    if (!S.M.years.length) { S.key = null; return; }
    var keep = S.key && S.M.byYear[S.key.y] && S.M.byYear[S.key.y].snaps[S.key.w];
    if (jump || !keep) { var y = S.M.years[S.M.years.length - 1], Y = S.M.byYear[y]; S.key = { y: y, w: Y.weeks[Y.weeks.length - 1] }; S.calMonth = null; }
  }
  // Enregistrement dans la base partagée de la page
  function saveReports(res) {
    var ok = res.filter(function (p) { return p.ok; }).sort(function (a, b) { return GP.ymdKey(a.end) - GP.ymdKey(b.end); });
    S.msgs = res.filter(function (p) { return !p.ok; }).map(function (p) { return { warn: true, text: t('ignored', { f: p.file }) }; });
    var chain = Promise.resolve(), curInfo = S.info ? S.info.endKey || 0 : 0;
    ok.forEach(function (p) {
      chain = chain.then(function () {
        var st = GP.toStore(p), id = GP.docId(p.year, p.week);
        var existed = S.files.some(function (f) { return f.year === p.year && f.week === p.week; });
        st.report.uploadedAt = new Date().toISOString();
        return DB.doc('reports/' + id).set(st.report).then(function () {
          S.msgs.push({ text: t(existed ? 'msgReplaced' : 'msgAdded', { w: p.week }) });
          if (st.info.endKey >= curInfo) { curInfo = st.info.endKey; return DB.doc('info/latest').set(st.info); }
        });
      });
    });
    S.jump = true;
    return chain.catch(function (e) {
      console.error(e);
      S.msgs.push({ warn: true, text: e && e.code === 'invalid_argument' ? t('errRights') : e && e.code === 'quota_exceeded' ? t('errQuota') : t('errSave') });
    }).then(function () { render(); });
  }
  function deleteWeek(k) {
    var p = k.split('-'), y = +p[0], w = +p[1];
    S.confirmDel = null;
    if (!LIVE) { S.files = S.files.filter(function (f) { return !(f.year === y && f.week === w); }); remerge(false); render(); return; }
    DB.doc('reports/' + GP.docId(y, w)).delete().then(function () { S.msgs = [{ text: t('msgDeleted', { w: w }) }]; render(); }).catch(function () { S.msgs = [{ warn: true, text: t('errRights') }]; render(); });
  }
  function boot() {
    if (!window.claude || !window.claude.use) return;
    S.loading = true; render();
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      DB = r[0]; var user = r[1];
      var canP = user ? user.canEdit().catch(function () { return true; }) : Promise.resolve(true);
      return canP.then(function (c) { CAN_EDIT = c !== false; });
    }).then(function () {
      if (!DB) { S.loading = false; render(); return; }
      LIVE = true;
      DB.collection('reports').onSnapshot(function (snap) {
        S.loading = false;
        S.files = snap.docs.map(function (d) { var o = Object.assign({ ok: true }, d.data()); o.mtime = Date.parse(o.uploadedAt || '') || 0; return o; });
        remerge(!!S.jump); S.jump = false;
        render();
      }, function (e) { console.error(e); S.loading = false; S.msgs = [{ warn: true, text: t('errLoad') }]; render(); });
      DB.doc('info/latest').onSnapshot(function (d) { S.info = d.exists ? d.data() : null; if (S.M && S.M.years.length) render(); }, function (e) { console.error(e); });
    }).catch(function (e) { console.error(e); S.loading = false; render(); });
  }
  input.addEventListener('change', function () { readFiles(input.files); input.value = ''; });
  var dragN = 0;
  window.addEventListener('dragenter', function (e) { if (S.editing) return; if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { dragN++; document.body.classList.add('dragging'); var z = document.querySelector('.gr-zone'); if (z) z.classList.add('over'); } });
  window.addEventListener('dragleave', function () { if (--dragN <= 0) { dragN = 0; document.body.classList.remove('dragging'); var z = document.querySelector('.gr-zone'); if (z) z.classList.remove('over'); } });
  window.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault(); dragN = 0; document.body.classList.remove('dragging'); readFiles(e.dataTransfer.files);
  });

  /* ---------- Actions ---------- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act],[data-tab],[data-shop],[data-hz],[data-lang],[data-ed]'); if (!a) return;
    if (a.hasAttribute('data-ed')) {
      var op = a.getAttribute('data-ed');
      if (op === 'done') { S.editing = false; document.body.classList.remove('editing'); render(); return; }
      if (op === 'reset') { setLayout(S.tab, defLayout(S.tab)); render(); return; }
      if (op === 'span') return;
      var host = a.closest('[data-id]'); if (host) editOp(host.getAttribute('data-id'), op);
      return;
    }
    if (a.hasAttribute('data-tab')) { S.tab = a.getAttribute('data-tab'); lsSet(LS.tab, S.tab); render(); window.scrollTo(0, 0); return; }
    if (a.hasAttribute('data-shop')) { S.shop = a.getAttribute('data-shop'); render(); return; }
    if (a.hasAttribute('data-hz')) { S.hz = a.getAttribute('data-hz'); render(); return; }
    if (a.hasAttribute('data-lang')) { S.lang = a.getAttribute('data-lang'); lsSet(LS.lang, S.lang); render(); return; }
    var act = a.getAttribute('data-act');
    if (act === 'import' || act === 'pick') input.click();
    if (act === 'delweek') { var k = a.getAttribute('data-k'); if (S.confirmDel === k) deleteWeek(k); else { S.confirmDel = k; render(); } }
    if (act === 'delcancel') { S.confirmDel = null; render(); }
    if (act === 'msgclose') { S.msgs = []; render(); }
    if (act === 'layout') { S.editing = !S.editing; document.body.classList.toggle('editing', S.editing); render(); }
    if (act === 'pdf') exportPdf();
  });
  document.addEventListener('change', function (e) {
    var a = e.target;
    if (a.getAttribute('data-act') === 'week') { var p = a.value.split('-'); S.key = { y: +p[0], w: +p[1] }; S.calMonth = null; render(); }
    if (a.getAttribute('data-act') === 'calMonth') { S.calMonth = +a.value; render(); }
    if (a.getAttribute('data-ed') === 'span') { var host = a.closest('[data-id]'); editOp(host.getAttribute('data-id'), 'span', a.value); }
  });
  // glisser-déposer des blocs en mode édition
  var dragId = null;
  document.addEventListener('dragstart', function (e) { var b = e.target.closest && e.target.closest('.blk'); if (!S.editing || !b) return; dragId = b.getAttribute('data-id'); b.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) { } });
  document.addEventListener('dragend', function () { dragId = null; document.querySelectorAll('.blk.dragging,.blk.drag-over').forEach(function (n) { n.classList.remove('dragging', 'drag-over'); }); });
  document.addEventListener('dragover', function (e) { if (!dragId) return; var b = e.target.closest && e.target.closest('.blk'); if (!b) return; e.preventDefault(); document.querySelectorAll('.blk.drag-over').forEach(function (n) { if (n !== b) n.classList.remove('drag-over'); }); b.classList.add('drag-over'); });
  document.addEventListener('drop', function (e) { if (!dragId) return; var b = e.target.closest && e.target.closest('.blk'); if (!b) return; e.preventDefault(); e.stopPropagation(); var to = b.getAttribute('data-id'); var from = dragId; dragId = null; if (to !== from) editOp(from, 'move', to); }, true);
  // déplacer le panneau
  (function () {
    var hd = panel.querySelector('header'), ox, oy, on = false;
    hd.addEventListener('mousedown', function (e) { if (e.target.tagName === 'BUTTON') return; on = true; var r = panel.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top; e.preventDefault(); });
    document.addEventListener('mousemove', function (e) { if (!on) return; panel.style.left = Math.max(0, e.clientX - ox) + 'px'; panel.style.top = Math.max(0, e.clientY - oy) + 'px'; panel.style.right = 'auto'; panel.style.bottom = 'auto'; });
    document.addEventListener('mouseup', function () { on = false; });
  })();
  document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('gr-zone')) { e.preventDefault(); input.click(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.editing) { S.editing = false; document.body.classList.remove('editing'); render(); } });

  /* ================= EXPORT PDF ================= */
  var pr = document.getElementById('gr-print');
  // PDF d'une page (A4 paysage) pour le point de vente sélectionné
  function buildPrint() {
    PRINTING = true; PTAB = 'pdf';
    document.body.classList.add('printing');
    var Y = Yr(), sn = snap(), today = new Date(), who = isShop() ? shopName(S.shop) : t('allShops');
    S.docTitle = document.title;
    var nt = 'Reporting ' + t('weekShort', { w: sn.week }) + ' ' + Y.year + ' - ' + who; document.title = nt; var te = document.querySelector('title'); if (te) te.textContent = nt;
    var sec = document.createElement('section'); sec.className = 'pp pp-one';
    sec.innerHTML = '<div class="pp-band"><img src="' + LOGO + '" alt="Galler"><div class="pp-t"><span>' + esc(t('appTitle')) + '</span><b>' + esc(who) + '</b></div><div class="pp-w"><b>' + esc(t('weekN', { w: sn.week }) + ' · ' + Y.year) + '</b><span>' + esc(weekRange(Y, sn.week)) + '</span><span class="g">' + esc(t('pdfGen', { d: dfmt({ y: today.getFullYear(), m: today.getMonth() + 1, d: today.getDate() }) })) + '</span></div></div><div class="gr-grid"></div>';
    pr.innerHTML = ''; pr.appendChild(sec);
    renderBlocks(sec.querySelector('.gr-grid'), 'pdf', defLayout('pdf'), false);
  }
  function coverArt() {
    var s = '<svg viewBox="0 0 520 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="520" height="700" fill="#fff"/>';
    s += '<rect x="40" y="0" width="250" height="700" fill="#D35E13"/>';
    for (var r = 0; r < 9; r++) for (var c = 0; c < 2; c++) s += '<rect x="' + (62 + c * 110) + '" y="' + (24 + r * 76) + '" width="96" height="58" rx="8" fill="#fff"/>';
    s += '<rect x="306" y="0" width="214" height="430" fill="#000"/><rect x="306" y="446" width="214" height="254" fill="#AF451C"/></svg>';
    return s;
  }
  function endPrint() { PRINTING = false; PTAB = null; document.body.classList.remove('printing'); pr.innerHTML = ''; if (S.docTitle) { document.title = S.docTitle; var te = document.querySelector('title'); if (te) te.textContent = S.docTitle; } render(); }
  function exportPdf() {
    buildPrint();
    var go = function () { setTimeout(function () { window.print(); }, 250); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  }
  window.addEventListener('afterprint', function () { if (PRINTING) endPrint(); });

  // API de test
  window.GR = { buildPrint: buildPrint, endPrint: endPrint, readFiles: readFiles, state: S, render: render };
  // Exemple intégré (aperçu de la mise en page) : les 3 rapports fournis
  if (window.GR_DEMO && !S.files.length) {
    S.files = GR_DEMO.reports.map(function (r) { return Object.assign({ ok: true }, r); });
    S.info = GR_DEMO.info; S.demo = true; remerge(true);
  }
  render();
  boot();
})();

</script>

</body></html>
